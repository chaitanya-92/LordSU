services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh","-c","exec redis-server --appendonly yes --save 60 1000 --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in the production environment}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ARTIFACT_DIR: /storage
      UPLOAD_DIR: /uploads
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_QUEUED_BUILDS: ${MAX_QUEUED_BUILDS:-3}
      BUILD_RATE_LIMIT: ${BUILD_RATE_LIMIT:-5}
      STATUS_RATE_LIMIT: ${STATUS_RATE_LIMIT:-120}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - build-artifacts:/storage
      - build-uploads:/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ARTIFACT_DIR: /storage
      UPLOAD_DIR: /uploads
      BUILDER_SCRIPT: /app/builder/src/build.js
      GIT_CACHE_DIR: /build-cache
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ARTIFACT_TTL_MS: ${ARTIFACT_TTL_MS:-86400000}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
    volumes:
      - build-artifacts:/storage
      - build-uploads:/uploads
      - gradle-cache:/root/.gradle
      - build-cache:/build-cache
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  redis-data:
  build-artifacts:
  build-uploads:
  gradle-cache:
  build-cache:
