services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm install && npm --prefix apps/api run start"
    environment:
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /storage
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - build-artifacts:/storage
      - /tmp:/tmp
    depends_on:
      - redis

  web:
    image: node:22-bookworm
    working_dir: /app/apps/web
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  redis-data:
  build-artifacts:
