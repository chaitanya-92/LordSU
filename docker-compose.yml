services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm --prefix apps/api install --omit=dev && npm --prefix apps/api run start"
    environment:
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /storage
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - build-artifacts:/storage
      - build-uploads:/uploads
    depends_on:
      - redis

  worker:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    working_dir: /app
    command: node /app/worker/src/worker.js
    environment:
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /storage
      BUILDER_SCRIPT: /app/builder/src/build.js
      GIT_CACHE_DIR: /build-cache
      WORKER_CONCURRENCY: 1
    volumes:
      - ./worker:/app/worker:ro
      - ./builder:/app/builder:ro
      - build-artifacts:/storage
      - build-uploads:/uploads
      - gradle-cache:/root/.gradle
      - build-cache:/build-cache
    depends_on:
      - redis

  web:
    image: node:22-bookworm
    working_dir: /app/apps/web
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  redis-data:
  build-artifacts:
  gradle-cache:
  build-cache:
